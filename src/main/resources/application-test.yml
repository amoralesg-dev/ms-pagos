spring:
  datasource:
    url: jdbc:h2:mem:pagos_test_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: ${APP_PORT:8082}
  servlet:
    context-path: /ms-pagos
cors:
  allowed-origins: "http://localhost:4200"

loader:
  path: ${LOADER_PATH:target/test-input}

logging:
  level:
    root: INFO
    com.rassini.pagos: DEBUG
    org.springframework: INFO
    org.hibernate: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ms-pagos